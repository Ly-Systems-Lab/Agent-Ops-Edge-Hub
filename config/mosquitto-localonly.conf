# Pi Hub · 最小可用 broker 配置（**只给本机服务用**）
#
# 用途：第一次把 pihub 跑起来时用这一份 —— 不需要证书、密码文件、ACL。
#       等你真的要接 ESP32-P4 面板或外部 Agent 时，再换成同目录的
#       `mosquitto-pihub.conf`（双 listener + TLS + mTLS）。
#
# ★ 为什么必须单独一份：
#    `mosquitto-pihub.conf` 的 8883 段**写死**了
#       password_file / acl_file / cafile / certfile / keyfile
#   这些文件不存在时，**mosquitto 会直接启动失败**（不是告警、是起不来）。
#    所以"最简部署"不能直接抄那一份 —— 这是实测踩到的坑。
#
# 安装位置：/etc/mosquitto/conf.d/pihub.conf
# 安装后：  sudo systemctl restart mosquitto
#
# ⚠️ 这一份**只绑回环**，意味着：
#    · 本机的 api / devctl / monitor / wecom_bot / p4_bot / car_bot 都能用
#    · 局域网里的 ESP32-C3 小电视**不走 MQTT**，它走 HTTP 5000，不受影响
#    · 任何跨机器的东西（P4 面板、外部 Agent）都连不进来 —— 那时请换配置文件
#
# 只有一条 listener 时不需要 `per_listener_settings true`；
# 一旦加到两条，认证/ACL 就必须**每条 listener 各写一遍**（见 mosquitto-pihub.conf 的注释）。

listener 1883 127.0.0.1
allow_anonymous true