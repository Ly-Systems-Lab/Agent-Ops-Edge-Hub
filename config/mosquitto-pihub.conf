# Pi Hub - MQTT 安全边界
# 依据 PI_HUB_SPEC.md §1 + P4-PI-AGENT-SPEC.md §2/§3
#
# 双监听设计（2026-10-24 起）：
#   1883 = 明文，仅 127.0.0.1 —— 本机 4 个 pihub 服务 + ESP32-C3 小电视链路，行为完全不变
#   8883 = TLS，局域网      —— ESP32-P4 控制面板 / 外部 Agent 适配器专用
#
# ★ 关键：per_listener_settings true 时，认证 / ACL 必须【每个 listener 各写一遍】，
#   不继承全局配置。这是最容易踩的坑——只在全局写一份，第二个 listener 会认证失效。
#
# 安装位置：/etc/mosquitto/conf.d/pihub.conf
# 安装后：sudo systemctl restart mosquitto
#
# ---------------------------------------------------------------
# 你需要自己生成的东西（本仓不提供，见 deploy/DEPLOY.md §5）
#   /etc/mosquitto/passwd   ← mosquitto_passwd -c
#   /etc/mosquitto/aclfile  ← 参考本目录 aclfile.example
#   /etc/mosquitto/certs/   ← ca.crt / broker.crt / broker.key
# ---------------------------------------------------------------

per_listener_settings true

# ---------- 监听 1：明文回环（旧设备 / 旧服务，零改动）----------
# 只给本机进程用：api.py / devctl.py / monitor.py / wecom_bot.py
listener 1883 127.0.0.1
allow_anonymous true

# ---------- 监听 2：TLS 局域网（P4 控制面板 / 外部 Agent）----------
listener 8883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile

cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile  /etc/mosquitto/certs/broker.key

# 双向认证：客户端必须带证书（P4 固件侧按此设计）
# ⚠️ 若你的客户端只做单向 TLS（只校验服务端），把 require_certificate 改为 false，
#    并自行确认 password_file 的认证强度足够。
require_certificate true
use_identity_as_username false
tls_version tlsv1.2
