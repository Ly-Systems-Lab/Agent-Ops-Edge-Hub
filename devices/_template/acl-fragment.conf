# ---- <name>（设备侧）----
# 复制到 /etc/mosquitto/aclfile 末尾并改掉 <name>，然后
#   sudo mosquitto_passwd /etc/mosquitto/passwd <name>
#   sudo systemctl restart mosquitto
#
# ⚠️ 只授它自己那两个主题。给 "#" 通配等于把整条总线交出去。
# ⚠️ 被 ACL 拒绝时 broker 仍回 SUBACK granted / PUBACK RC 0（MQTT 3.1.1），
#    判据只能是「实际收到了哪些主题」，别看返回码。
user <name>
topic read  hub/command/<name>
topic write hub/command/<name>/ack
# 设备要接收告警时再加一行（按需，别默认开）：
# topic read hub/alert/#
